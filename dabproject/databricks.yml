# This is a Databricks asset bundle definition for dabproject.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dabproject
  uuid: 410886a7-241c-47c0-bf13-2139d9dc570c

include:
  - resources/*.yml
  - resources/*/*.yml


targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    presets:
      name_prefix: dev_${workspace.current_user.short_name}
      source_linked_deployment: false
    workspace:
      host: https://dbc-a190b310-5f3a.cloud.databricks.com/
  prod:
    mode: production
    workspace:
      host: https://dbc-a190b310-5f3a.cloud.databricks.com/
      # We explicitly deploy to /Workspace/Users/bihariswatisonalika@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/bihariswatisonalika@gmail.com/PROD/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - group_name: admins
        level: CAN_MANAGE
